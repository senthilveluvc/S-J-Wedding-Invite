<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA65" />
      <stop offset="30%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#99732B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="goldShine" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Ornate Filigree Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- Botanical / Vine Garland Accents -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="1.2" opacity="0.85">
    <!-- Top crest flourish -->
    <path d="M 180 32 C 190 20, 210 20, 220 32 C 205 38, 195 38, 180 32 Z" fill="url(#goldGrad)"/>
    <circle cx="200" cy="22" r="3" fill="url(#goldGrad)"/>
    <path d="M 150 42 C 175 35, 225 35, 250 42 C 235 48, 165 48, 150 42 Z"/>
    <!-- Bottom crest flourish -->
    <path d="M 180 368 C 190 380, 210 380, 220 368 C 205 362, 195 362, 180 368 Z" fill="url(#goldGrad)"/>
    <circle cx="200" cy="378" r="3" fill="url(#goldGrad)"/>
    <path d="M 150 358 C 175 365, 225 365, 250 358 C 235 352, 165 352, 150 358 Z"/>
    <!-- Leaf clusters left & right -->
    <circle cx="34" cy="200" r="2.5" fill="url(#goldGrad)"/>
    <circle cx="366" cy="200" r="2.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Central Intertwined Monogram: S & J -->
  <g filter="url(#goldShine)">
    <!-- Letter S -->
    <text x="165" y="235" 
          font-family="'Alex Brush', 'Pinyon Script', 'Great Vibes', serif" 
          font-size="160" 
          font-weight="normal"
          fill="url(#goldGrad)" 
          text-anchor="middle"
          letter-spacing="-5">S</text>

    <!-- Ampersand & in center background -->
    <text x="202" y="218" 
          font-family="'Cormorant Garamond', 'Georgia', serif" 
          font-size="64" 
          font-style="italic"
          font-weight="300"
          fill="url(#goldGrad)" 
          opacity="0.75"
          text-anchor="middle">&amp;</text>

    <!-- Letter J -->
    <text x="240" y="245" 
          font-family="'Alex Brush', 'Pinyon Script', 'Great Vibes', serif" 
          font-size="165" 
          font-weight="normal"
          fill="url(#goldGrad)" 
          text-anchor="middle"
          letter-spacing="-5">J</text>
  </g>

  <!-- Bottom Date / Subtext -->
  <text x="200" y="318" 
        font-family="'Montserrat', sans-serif" 
        font-size="11" 
        font-weight="500" 
        letter-spacing="6" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        opacity="0.85">SOWNDARYA &amp; JAYANTH</text>
</svg>
